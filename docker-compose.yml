# 배포: cp .env.example .env (LINER_API_KEY 입력) → docker compose up -d --build
# 값은 같은 폴더의 .env(Coolify는 Environment Variables)에서 읽습니다.
# 호스트 포트는 열지 않습니다. Coolify 등 프록시가 컨테이너 8000번으로 직접 연결하므로 서버의 다른 앱과 포트가 겹치지 않습니다.
# 프록시 없이 서버에서 직접 띄울 때는 docker-compose.override.yml이 자동으로 함께 읽혀 HOST_PORT를 엽니다.
services:
  app:
    build: .
    environment:
      LINER_API_KEY: ${LINER_API_KEY:?LINER_API_KEY를 .env에 넣어 주세요}
      FOODSAFETY_API_KEY: ${FOODSAFETY_API_KEY:-}
      DECISION_MODEL: ${DECISION_MODEL:-perplexity/pplx-decider-v1.2}
      PORT: 8000
    expose:
      - "8000"
    restart: unless-stopped
